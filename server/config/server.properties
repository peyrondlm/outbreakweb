# reo-web bioserver configuration.
# Machine specific values (DB password, public IP) go in config/local.properties,
# which overrides this file and is not committed. Any key can also be overridden
# with -Dreo.<key>=<value>.

# Which games to run in this process (one JVM can run both).
games=file1,file2

# Address the lobby/game sockets bind to. The gateway reaches them on loopback.
bind=127.0.0.1

# IP the clients must reach us at. Used for GSINFO (gameserver address sent to
# the client) and for the DNS override map served at /api/dns.
public_ip=127.0.0.1

# ---- Hostnames the PS2 clients resolve (DNS override targets) -------------
# US (SLUS-20765 / SLUS-20984), found in SLUS_207.65 at 0x159CF4..0x159D84:
hosts.lobby=app01.reo.capcom.sf.yav4.com
hosts.snap=snap01.reo.capcom.sf.yav4.com
hosts.regweb=regweb.reo.capcom.sf.yav4.com
# JP (Bioserver upstream), kept for reference:
# hosts.kddi=www01.kddi-mmbb.jp

# ---- File #1 -------------------------------------------------------------
# Upstream (JP) ports. The US ports are unknown until we capture the client.
file1.lobby_port=8300
file1.game_port=8690
# Gameserver address advertised in GSINFO (defaults: public_ip / game_port)
#file1.gs_ip=
#file1.gs_port=
file1.db.name=bioserver1
# Protocol profile. Only "jp" (Bioserver) exists; "us" is the extension point.
file1.protocol=jp

# ---- File #2 -------------------------------------------------------------
file2.lobby_port=8200
file2.game_port=8590
file2.db.name=bioserver2
file2.protocol=jp

# ---- Database ------------------------------------------------------------
db.host=localhost
db.port=3306
db.user=bioserver
# db.password=   -> set in config/local.properties (scripts/setup.sh generates it)

# ---- HTTP API (for the website) -----------------------------------------
api.enabled=true
api.bind=127.0.0.1
api.port=8088
api.cors_origin=*
# POST /api/dev/login creates a game session from users/passwd (loopback only).
# Stand-in for the regweb/KDDI web login. Disable before public use.
api.dev_login=true

# ---- Packet log (protocol work) -----------------------------------------
# off | header (parsed 12-byte headers only) | hex (headers + raw hexdump)
packetlog.mode=off
packetlog.file=logs/packets.log
packetlog.stdout=false

# ---- Raw sniffers --------------------------------------------------------
# Capture-only TCP listeners for ports we do not understand yet (e.g. what the
# US client opens towards app01/snap01). Comma separated. Forces packetlog hex.
sniff.ports=

# ---- US clients (SLUS-20765), protocol "us" --------------------------------
# app01:10127 news/download service the US client opens first (reo.us.UsAppService,
# docs/notes/protocol.md section 6.1). It is not the lobby.
us.app.enabled=true
us.app.port=10127
# HTML shown as the news page (01/TOP_INFOR.HTM), max 4 KB. Empty = built-in text.
us.app.info_file=
# File #2 AREA SELECT names and descriptions (areas 1..10). Name <= 23 chars (ASCII); description
# "line 1|line 2" (line 2 in color) or raw markup starting with <BODY>, <= 255 bytes. Empty = built-in
# (UsAppService.F2_AREAS: Free Area, Beginners, Veterans, Survival, Nightmare, Infinity, Elimination,
# Showdown, Scenario Run, Lounge). Example:
#us.f2.area.1.name=Free Area
#us.f2.area.1.desc=Join games or create your own.|All scenarios are open in every area.
